<section class="payment-result payment-result--success">
  <mat-icon class="result-icon">check_circle</mat-icon>
  <h1>Payment successful</h1>
  <p>
    Your card transaction has been received. The reservation was confirmed through the payment system.
  </p>
  <p *ngIf="sessionId">Stripe session reference: <strong>{{ sessionId }}</strong></p>
  <a mat-raised-button color="primary" routerLink="/">Return to home page</a>
</section>
