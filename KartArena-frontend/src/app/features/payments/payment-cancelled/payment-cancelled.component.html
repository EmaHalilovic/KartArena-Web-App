<section class="payment-result payment-result--cancelled">
  <mat-icon class="result-icon">cancel</mat-icon>
  <h1>Payment not completed</h1>
  <p>The Stripe payment was cancelled or not completed. Your cart has been saved so you can try again.</p>
  <button mat-raised-button color="primary" type="button" (click)="returnToReservations()">Try again</button>
</section>
