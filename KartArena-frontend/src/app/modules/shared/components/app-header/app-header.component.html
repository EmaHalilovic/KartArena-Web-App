<header class="hdr">
  <div class="container row">
    <a class="brand" routerLink="/" aria-label="KartArena">
      <img class="logo" src="assets/logo-red.png" alt="KartArena" />
      <span class="name">Kart Arena</span>
    </a>

    <nav class="nav">
      <a routerLink="/tracks" routerLinkActive="active">TRACKS</a>
      <a routerLink="/karts" routerLinkActive="active">KARTS</a>
      <a routerLink="/prices" routerLinkActive="active">PRICING</a>
      <a [routerLink]="['/']" fragment="contact" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">CONTACT</a>
      <a routerLink="/stats" routerLinkActive="active">STATISTICS</a>
    </nav>

    <div class="header-actions">
      <a class="login-link" routerLink="/auth/login">LOGIN</a>
      <a class="cta" routerLink="/reservations">MAKE A RESERVATION</a>
    </div>
  </div>
</header>
