<button
  mat-icon-button
  type="button"
  class="theme-toggle"
  (click)="themeService.toggle()"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Activate light mode' : 'Activate dark mode'"
  [attr.title]="themeService.theme() === 'dark' ? 'Light mode' : 'Dark mode'"
>
  <mat-icon>{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
</button>
